name: Add Personal Desktop project card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-personal-desktop-project.yml'

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Personal Desktop card only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          url = 'https://saaeiddev.github.io/Amir-Saeid-Dehghan-Website-2-/'
          if url in text:
              print('Project card already present; no change needed.')
              raise SystemExit(0)
          anchor = '            <a class="feature-card" href="https://saaeiddev.github.io/Device-Repair-/" target="_blank" rel="noopener noreferrer"><span class="feature-icon">🛠️</span><h3>Device Repair — 3D Hardware Explorer</h3><p>Interactive 3D Hardware Learning ↗</p></a>'
          card = '            <a class="feature-card" href="https://saaeiddev.github.io/Amir-Saeid-Dehghan-Website-2-/" target="_blank" rel="noopener noreferrer"><span class="feature-icon">🖥️</span><h3>AMIR SAEID DEHGHAN — PERSONAL DESKTOP</h3><p>Interactive macOS Personal Portfolio ↗</p></a>'
          if anchor not in text:
              raise SystemExit('Expected Projects anchor not found; refusing to modify unrelated content.')
          path.write_text(text.replace(anchor, anchor + '\n' + card, 1), encoding='utf-8')
          PY
      - name: Commit project card
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Personal Desktop to Websites & Projects"
          git push
