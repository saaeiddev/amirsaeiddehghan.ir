<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070a11" />
  <meta name="description" content="آزمایشگاه تعاملی سه‌بعدی موتور خودرو با رابط کاربری Liquid Glass" />
  <title>Engine Lab | آزمایشگاه موتور</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#070a11;overflow:hidden}
    body{background:
      radial-gradient(circle at 18% 16%,rgba(83,220,255,.14),transparent 30%),
      radial-gradient(circle at 82% 78%,rgba(134,92,255,.12),transparent 34%),
      linear-gradient(145deg,#060912,#0b1320 55%,#071019)}
    #engineApp{width:100%;height:100%;border:0;display:block;opacity:0;transform:scale(1.008);transition:opacity .35s ease,transform .55s cubic-bezier(.2,.8,.2,1);background:transparent}
    #engineApp.ready{opacity:1;transform:scale(1)}
    .boot{position:fixed;inset:0;display:grid;place-items:center;color:#dffaff;font:600 14px/1.7 system-ui,sans-serif;letter-spacing:.03em;pointer-events:none;transition:opacity .3s ease}
    .boot::before{content:"";width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:#75e9ff;animation:spin .8s linear infinite;position:absolute;transform:translateY(-34px)}
    .boot.hide{opacity:0}
    @keyframes spin{to{transform:translateY(-34px) rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){#engineApp,.boot{transition:none}.boot::before{animation:none}}
  </style>
</head>
<body>
  <div class="boot" id="boot">در حال آماده‌سازی آزمایشگاه موتور…</div>
  <iframe id="engineApp" src="./app.html" title="آزمایشگاه تعاملی سه‌بعدی موتور خودرو"></iframe>
  <script>
    const frame=document.getElementById('engineApp');
    const boot=document.getElementById('boot');
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc)return;

      const font=document.createElement('link');
      font.rel='stylesheet';
      font.href='https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap';
      doc.head.appendChild(font);

      const style=document.createElement('style');
      style.id='liquid-glass-theme';
      style.textContent=`
      :root{
        --glass:rgba(16,29,43,.48);
        --glass-strong:rgba(14,27,40,.68);
        --glass-soft:rgba(255,255,255,.055);
        --line:rgba(255,255,255,.14);
        --line-bright:rgba(190,244,255,.32);
        --text:#f3fbff;
        --muted:#aec4d4;
        --cyan:#7eeeff;
        --cyan-2:#63d9ee;
        --violet:#9f8cff;
        --amber:#ffbe7d;
        --shadow:0 28px 70px rgba(0,0,0,.40),0 8px 24px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12);
      }
      *{box-sizing:border-box}
      html{background:#070a11;color-scheme:dark}
      body{
        margin:0;
        min-height:100vh;
        color:var(--text);
        font-family:'Vazirmatn',Tahoma,Arial,sans-serif!important;
        font-size:16px;
        background:
          radial-gradient(900px 620px at 12% 10%,rgba(69,212,255,.13),transparent 62%),
          radial-gradient(880px 680px at 88% 82%,rgba(126,94,255,.11),transparent 64%),
          radial-gradient(620px 420px at 55% 40%,rgba(65,154,209,.08),transparent 70%),
          linear-gradient(145deg,#060a12 0%,#0a1420 48%,#071018 100%)!important;
        background-attachment:fixed!important;
        overflow-x:hidden;
        position:relative;
        isolation:isolate;
      }
      body::before,body::after{
        content:"";
        position:fixed;
        z-index:-1;
        width:34vw;
        height:34vw;
        min-width:300px;
        min-height:300px;
        max-width:620px;
        max-height:620px;
        border-radius:50%;
        filter:blur(34px);
        opacity:.45;
        pointer-events:none;
        animation:ambientFloat 12s ease-in-out infinite alternate;
      }
      body::before{top:-12vw;right:-8vw;background:radial-gradient(circle,rgba(91,226,255,.28),rgba(82,150,255,.08) 46%,transparent 72%)}
      body::after{bottom:-14vw;left:-8vw;background:radial-gradient(circle,rgba(164,111,255,.21),rgba(78,191,255,.06) 48%,transparent 72%);animation-duration:15s;animation-direction:alternate-reverse}
      @keyframes ambientFloat{from{transform:translate3d(-1.5%,0,0) scale(1)}to{transform:translate3d(4%,3%,0) scale(1.08)}}
      @keyframes glassIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes shimmer{0%{transform:translateX(-130%) rotate(12deg)}55%,100%{transform:translateX(260%) rotate(12deg)}}

      button,input{font:inherit}
      button{
        cursor:pointer;
        color:#eafaff!important;
        border:1px solid rgba(255,255,255,.12)!important;
        border-radius:15px!important;
        padding:12px 16px!important;
        background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.045))!important;
        -webkit-backdrop-filter:blur(18px) saturate(150%);
        backdrop-filter:blur(18px) saturate(150%);
        box-shadow:0 10px 26px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(255,255,255,.03)!important;
        transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s ease,background .22s ease,box-shadow .22s ease!important;
        transform:translateZ(0);
      }
      button:hover{
        transform:translateY(-3px) scale(1.015);
        border-color:rgba(126,238,255,.36)!important;
        background:linear-gradient(145deg,rgba(126,238,255,.15),rgba(255,255,255,.055))!important;
        box-shadow:0 15px 34px rgba(0,0,0,.26),0 0 28px rgba(92,226,255,.08),inset 0 1px 0 rgba(255,255,255,.18)!important;
      }
      button:active{transform:translateY(-1px) scale(.99)}
      button:focus-visible,input:focus-visible{outline:2px solid var(--cyan)!important;outline-offset:3px!important}
      button[aria-pressed=true]{
        color:#dffeff!important;
        border-color:rgba(126,238,255,.50)!important;
        background:linear-gradient(145deg,rgba(68,214,235,.24),rgba(92,122,255,.14))!important;
        box-shadow:0 12px 30px rgba(0,0,0,.26),0 0 32px rgba(74,220,255,.14),inset 0 1px 0 rgba(255,255,255,.18)!important;
      }

      header{
        position:sticky!important;
        top:12px;
        z-index:40;
        display:flex;
        justify-content:space-between;
        align-items:center;
        width:calc(100% - 6vw);
        margin:12px 3vw 0;
        padding:15px 22px!important;
        border:1px solid rgba(255,255,255,.13)!important;
        border-radius:20px!important;
        background:linear-gradient(135deg,rgba(19,34,49,.70),rgba(13,24,37,.42))!important;
        -webkit-backdrop-filter:blur(28px) saturate(170%);
        backdrop-filter:blur(28px) saturate(170%);
        box-shadow:0 18px 45px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.13)!important;
        animation:glassIn .65s cubic-bezier(.2,.8,.2,1) both;
      }
      header::before{
        content:"";
        position:absolute;
        inset:1px;
        border-radius:19px;
        pointer-events:none;
        background:linear-gradient(110deg,rgba(255,255,255,.09),transparent 28%,transparent 72%,rgba(126,238,255,.045));
      }
      .brand{
        direction:ltr;
        font-family:Arial,sans-serif!important;
        font-size:24px!important;
        letter-spacing:3.4px!important;
        font-weight:800!important;
        text-shadow:0 0 24px rgba(126,238,255,.14);
      }
      .brand span{color:var(--cyan)!important;text-shadow:0 0 20px rgba(126,238,255,.35)}
      .edition{font-size:12px!important;color:#bdd0dc!important;letter-spacing:.02em}

      main{max-width:1700px!important;margin:auto!important;padding:34px 3% 34px!important;position:relative;z-index:2}
      h1{
        font-family:'Vazirmatn',Tahoma,sans-serif!important;
        font-size:clamp(29px,3.1vw,46px)!important;
        font-weight:800!important;
        letter-spacing:-.025em;
        margin:9px 0 10px!important;
        background:linear-gradient(100deg,#ffffff 8%,#dffbff 55%,#a8eefe 100%);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent!important;
        filter:drop-shadow(0 8px 20px rgba(54,199,240,.10));
      }
      .intro{color:#b7cbd8!important;line-height:2!important;margin:0 0 24px!important;font-weight:400}
      .eyebrow{color:var(--cyan)!important;font-size:12px!important;letter-spacing:2.4px!important;font-weight:700!important;direction:ltr;text-align:right;text-shadow:0 0 16px rgba(126,238,255,.24)}

      .workspace{
        display:grid!important;
        grid-template-columns:minmax(285px,350px) minmax(0,1fr)!important;
        gap:22px!important;
        align-items:start!important;
        perspective:1400px;
      }
      .panel{
        position:relative;
        overflow:hidden;
        border:1px solid rgba(255,255,255,.14)!important;
        border-radius:26px!important;
        padding:27px!important;
        background:
          linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.025) 42%,rgba(83,218,255,.035)),
          rgba(12,25,38,.54)!important;
        -webkit-backdrop-filter:blur(30px) saturate(165%);
        backdrop-filter:blur(30px) saturate(165%);
        box-shadow:var(--shadow)!important;
        transform-style:preserve-3d;
        transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,border-color .35s ease;
        animation:glassIn .75s .05s cubic-bezier(.2,.8,.2,1) both;
      }
      .panel::before{
        content:"";
        position:absolute;
        inset:-25% auto -25% -35%;
        width:26%;
        pointer-events:none;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
        transform:rotate(12deg);
        animation:shimmer 7.5s 1.2s ease-in-out infinite;
      }
      .panel:hover{transform:translateY(-5px) rotateX(.35deg);border-color:rgba(174,242,255,.22)!important;box-shadow:0 34px 85px rgba(0,0,0,.44),0 0 38px rgba(94,219,255,.055),inset 0 1px 0 rgba(255,255,255,.15)!important}
      .panel h2{font-size:28px!important;font-weight:750!important;margin:12px 0 5px!important;color:#f6fcff!important}
      .english{direction:ltr;text-align:right;color:#8fa9bc!important;font-size:13px!important;letter-spacing:.02em}
      .panel p{line-height:2.05!important;color:#c5d6e1!important}
      .note{
        border:1px solid rgba(255,190,125,.16)!important;
        border-right:2px solid var(--amber)!important;
        border-radius:14px!important;
        padding:12px 14px!important;
        background:linear-gradient(135deg,rgba(255,190,125,.07),rgba(255,255,255,.025))!important;
        color:#f3d8bb!important;
        font-size:13px!important;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
      }
      .key{display:flex!important;gap:13px!important;flex-wrap:wrap;color:#a7bdcb!important;font-size:12px!important;margin-top:17px!important}
      .key b{color:var(--cyan)!important;text-shadow:0 0 12px rgba(126,238,255,.65)}

      .viewer{min-width:0;animation:glassIn .78s .10s cubic-bezier(.2,.8,.2,1) both}
      .stage{
        position:relative!important;
        height:580px!important;
        overflow:hidden!important;
        border:1px solid rgba(255,255,255,.15)!important;
        border-radius:30px!important;
        background:
          radial-gradient(ellipse at 50% 32%,rgba(78,168,217,.20),rgba(14,31,47,.52) 45%,rgba(6,13,22,.72) 78%),
          linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.015))!important;
        -webkit-backdrop-filter:blur(24px) saturate(150%);
        backdrop-filter:blur(24px) saturate(150%);
        box-shadow:0 36px 90px rgba(0,0,0,.42),0 12px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 70px rgba(72,185,240,.025)!important;
      }
      .stage::before{
        content:"";
        position:absolute;
        z-index:3;
        inset:0;
        pointer-events:none;
        border-radius:inherit;
        background:linear-gradient(125deg,rgba(255,255,255,.10),transparent 19%,transparent 64%,rgba(126,238,255,.045));
        mix-blend-mode:screen;
      }
      .stage::after{
        content:"";
        position:absolute;
        z-index:3;
        top:-40%;left:-28%;
        width:30%;height:180%;
        pointer-events:none;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);
        transform:rotate(15deg);
        animation:shimmer 9s 1.5s ease-in-out infinite;
      }
      canvas{width:100%!important;height:100%!important;display:block!important;touch-action:none;filter:saturate(1.06) contrast(1.02) drop-shadow(0 22px 32px rgba(0,0,0,.16))}
      .stageLabel,.hint{
        z-index:5;
        border:1px solid rgba(255,255,255,.11);
        background:rgba(9,20,31,.44);
        -webkit-backdrop-filter:blur(16px) saturate(145%);
        backdrop-filter:blur(16px) saturate(145%);
        box-shadow:0 10px 28px rgba(0,0,0,.17),inset 0 1px 0 rgba(255,255,255,.08);
      }
      .stageLabel{top:18px!important;left:18px!important;padding:8px 11px;border-radius:11px;font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace!important;letter-spacing:1.7px!important;color:#adddeb!important}
      .hint{bottom:14px!important;right:14px!important;left:14px!important;width:max-content;max-width:calc(100% - 28px);margin:auto;padding:8px 13px;border-radius:13px;font-size:12px!important;color:#c2d7e4!important}

      .controls{
        display:flex!important;
        gap:9px!important;
        flex-wrap:wrap!important;
        margin:14px 0 10px!important;
        padding:10px!important;
        border:1px solid rgba(255,255,255,.09);
        border-radius:20px;
        background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
        -webkit-backdrop-filter:blur(18px) saturate(145%);
        backdrop-filter:blur(18px) saturate(145%);
        box-shadow:0 15px 38px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.07);
      }
      .controls button{flex:0 0 auto}
      .speed{
        display:flex!important;
        align-items:center!important;
        gap:12px!important;
        width:max-content;
        max-width:100%;
        margin:0 0 13px!important;
        padding:10px 14px!important;
        border:1px solid rgba(255,255,255,.09);
        border-radius:16px;
        background:rgba(255,255,255,.035);
        -webkit-backdrop-filter:blur(15px);
        backdrop-filter:blur(15px);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
        color:#bdced9!important;
        font-size:13px!important;
      }
      input[type=range]{accent-color:var(--cyan)!important;max-width:170px!important;filter:drop-shadow(0 0 8px rgba(126,238,255,.25))}

      .parts{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:9px!important;margin-top:11px!important}
      .parts button{position:relative;text-align:right!important;font-size:13px!important;padding:13px 12px!important;overflow:hidden}
      .parts button::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.055),transparent 32%)}
      .parts small{color:#7ed9e5!important;padding-left:7px!important;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;opacity:.9}
      .footer{
        color:#8da4b6!important;
        font-size:12px!important;
        line-height:1.95!important;
        margin-top:21px!important;
        padding:15px 18px;
        border:1px solid rgba(255,255,255,.08);
        border-radius:16px;
        background:rgba(255,255,255,.025);
        -webkit-backdrop-filter:blur(13px);
        backdrop-filter:blur(13px);
      }
      .error{z-index:8!important;background:rgba(18,39,53,.78)!important;border:1px solid rgba(255,255,255,.12)!important;-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:var(--shadow)!important}
      .hidden{display:none!important}

      ::-webkit-scrollbar{width:10px;height:10px}
      ::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}
      ::-webkit-scrollbar-thumb{background:linear-gradient(#31586a,#264151);border:2px solid transparent;background-clip:padding-box;border-radius:999px}
      ::selection{background:rgba(91,220,255,.26);color:#fff}

      @media(max-width:900px){
        header{top:8px;width:calc(100% - 24px);margin:8px 12px 0;padding:14px 16px!important;border-radius:18px!important}
        main{padding:26px 14px 28px!important}
        .workspace{grid-template-columns:1fr!important;gap:16px!important}
        .viewer{grid-row:1}
        .stage{height:480px!important;border-radius:24px!important}
        .panel{padding:21px!important;border-radius:22px!important}
        .parts{grid-template-columns:repeat(3,1fr)!important}
        .panel:hover{transform:none}
      }
      @media(max-width:520px){
        body::before,body::after{opacity:.32}
        .brand{font-size:18px!important;letter-spacing:2.2px!important}
        .edition{font-size:10px!important}
        h1{font-size:27px!important;line-height:1.45}
        .intro{font-size:13px!important}
        .stage{height:400px!important;border-radius:22px!important}
        .stageLabel{top:12px!important;left:12px!important;font-size:9px!important}
        .hint{font-size:10px!important;bottom:10px!important;right:10px!important;left:10px!important;padding:7px 9px}
        .controls{gap:7px!important;padding:8px!important;border-radius:17px!important}
        .controls button{padding:10px 11px!important;font-size:12px!important}
        .speed{font-size:11px!important;gap:8px!important;flex-wrap:wrap}
        .parts{grid-template-columns:repeat(2,1fr)!important;gap:7px!important}
        .parts button{font-size:12px!important;padding:11px 10px!important}
      }
      @media(prefers-reduced-motion:reduce){
        *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
      }
      `;
      doc.head.appendChild(style);

      const syncThemeColor=()=>{
        let meta=doc.querySelector('meta[name="theme-color"]');
        if(!meta){meta=doc.createElement('meta');meta.name='theme-color';doc.head.appendChild(meta)}
        meta.content='#070a11';
      };
      syncThemeColor();

      requestAnimationFrame(()=>{
        frame.classList.add('ready');
        boot.classList.add('hide');
        setTimeout(()=>boot.remove(),350);
      });
    });
  </script>
</body>
</html>
